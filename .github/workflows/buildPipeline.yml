name: CI Pipeline (Build + CodeLogic Scan)
on:
  push:
    branches:
      - codelogic
      - renovate/**

  pull_request:
    branches:
      #- codelogic
      - renovate/**

  workflow_dispatch:

concurrency:
  group: build-scan-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

env:
  BUILD_CONFIGURATION: Release
  # Single folder on the runner: all project outputs (libs + apps) for CodeLogic and artifacts.
  PUBLISH_OUTPUT: artifacts/out

jobs:
  build-and-scan:
    name: Build + CodeLogic Scan
    runs-on: ubuntu-latest
    # TEMP: uncomment when re-enabling CodeLogic steps below
    # environment: CodeLogic Scan Env

    permissions:
      contents: read

    env:
      DOTNET_MULTILEVEL_LOOKUP: "0"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      CI: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show disk space (runner)
        shell: bash
        run: |
          df -h
          docker system df || true

      - name: Resolve .NET SDK (global.json or TargetFramework)
        id: dotnet
        shell: bash
        run: |
          set -euo pipefail
          for candidate in global.json src/global.json; do
            if [ -f "$candidate" ]; then
              echo "Using SDK from $candidate"
              echo "setup_mode=global-json" >> "$GITHUB_OUTPUT"
              echo "global_json_path=$candidate" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No global.json; deriving SDK channel from TargetFramework(s) in .csproj / .props"
          tfms=$(
            { grep -RhoP '<TargetFramework>\K[^<]+' --include='*.csproj' --include='*.props' . 2>/dev/null || true
              grep -RhoP '<TargetFrameworks>\K[^<]+' --include='*.csproj' --include='*.props' . 2>/dev/null || true
            } | tr ';' '\n' | tr -d ' \r' | grep -E '^net[0-9]+\.[0-9]+$' | sort -u
          )
          if [ -z "$tfms" ]; then
            echo "Could not find TargetFramework(s). Add a global.json or netX.Y TFM in a .csproj."
            exit 1
          fi
          max_major=0
          max_minor=0
          while IFS= read -r tfm; do
            [ -z "$tfm" ] && continue
            if [[ "$tfm" =~ ^net([0-9]+)\.([0-9]+)$ ]]; then
              major="${BASH_REMATCH[1]}"
              minor="${BASH_REMATCH[2]}"
              if [ "$major" -gt "$max_major" ] || { [ "$major" -eq "$max_major" ] && [ "$minor" -gt "$max_minor" ]; }; then
                max_major=$major
                max_minor=$minor
              fi
            fi
          done <<< "$tfms"
          channel="${max_major}.${max_minor}.x"
          echo "Highest TFM implies SDK channel: $channel (from: $(echo "$tfms" | tr '\n' ' '))"
          echo "setup_mode=channel" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Setup .NET (global.json)
        if: steps.dotnet.outputs.setup_mode == 'global-json'
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: ${{ steps.dotnet.outputs.global_json_path }}

      - name: Setup .NET (derived channel)
        if: steps.dotnet.outputs.setup_mode == 'channel'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ steps.dotnet.outputs.channel }}

      - name: Confirm .NET SDK resolution
        shell: bash
        run: |
          set -euo pipefail
          which dotnet
          dotnet --version
          dotnet --info

      # One log file for CodeLogic send_build_info: restore + build + publish (failure in restore
      # previously left no build.log because the Build step never ran).
      - name: Restore, build, publish (capture build.log for CodeLogic)
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail

          mkdir -p "${GITHUB_WORKSPACE}/logs"
          BUILD_LOG="${GITHUB_WORKSPACE}/logs/build.log"
          echo "BUILD_LOG=${BUILD_LOG}" >> "$GITHUB_ENV"
          mkdir -p "${{ env.PUBLISH_OUTPUT }}"

          {
            echo "========== CI build log =========="
            echo "Repository: ${{ github.repository }}"
            echo "Workflow: ${{ github.workflow }}  Run: ${{ github.run_id }}  Attempt: ${{ github.run_attempt }}"
            echo "Ref: ${{ github.ref }}  SHA: ${{ github.sha }}"
            echo "========== dotnet --version =========="
            dotnet --version
            echo "========== dotnet --info =========="
            dotnet --info
            echo "========== Restore all solutions =========="
            count=0
            while IFS= read -r sln; do
              [ -z "$sln" ] && continue
              count=$((count + 1))
              echo "Restoring: $sln"
              dotnet restore "$sln" -p:NuGetAudit=false
            done < <(find . -name "*.sln" -not -path "./.git/*" | sort)
            if [ "$count" -eq 0 ]; then
              echo "ERROR: No solution files found."
              exit 1
            fi
            echo "========== Build all solutions =========="
            while IFS= read -r sln; do
              [ -z "$sln" ] && continue
              echo "=== dotnet build $sln ==="
              dotnet build "$sln" \
                -c "${{ env.BUILD_CONFIGURATION }}" \
                /p:TreatWarningsAsErrors=false \
                -p:NuGetAudit=false \
                -p:DeployOnBuild=false \
                --no-restore
            done < <(find . -name "*.sln" -not -path "./.git/*" | sort)
            echo "========== Publish all solutions =========="
            while IFS= read -r sln; do
              [ -z "$sln" ] && continue
              echo "Publishing solution: $sln -> ${{ env.PUBLISH_OUTPUT }}"
              dotnet publish "$sln" \
                -c "${{ env.BUILD_CONFIGURATION }}" \
                --no-build \
                -o "${{ env.PUBLISH_OUTPUT }}" \
                /p:TreatWarningsAsErrors=false \
                -p:NuGetAudit=false \
                -p:DeployOnBuild=false \
                -p:DeployOnPublish=False
            done < <(find . -name "*.sln" -not -path "./.git/*" | sort)
            echo "========== Done =========="
          } 2>&1 | tee -a "${BUILD_LOG}"

      - name: Upload publish output
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-publish
          path: ${{ env.PUBLISH_OUTPUT }}
          if-no-files-found: error

      - name: Run CodeLogic Scan (published output + ref-path without breaking agent)
        if: always()
        env:
          CODELOGIC_HOST: ${{ vars.CODELOGIC_HOST }}
          AGENT_UUID: ${{ secrets.AGENT_UUID }}
          AGENT_PASSWORD: ${{ secrets.AGENT_PASSWORD }}
          # Optional: multiline repository variable — one JDBC/database identity per line (CodeLogic UI → NodeDetails).
          CODELOGIC_DATABASE_IDENTITIES: ${{ vars.CODELOGIC_DATABASE_IDENTITIES }}
        shell: bash
        run: |
          set -euo pipefail

          PUBLISH_DIR="${GITHUB_WORKSPACE}/${{ env.PUBLISH_OUTPUT }}"
          chmod +x "${GITHUB_WORKSPACE}/scripts/codelogic/run-dotnet-analyze.sh"
          "${GITHUB_WORKSPACE}/scripts/codelogic/run-dotnet-analyze.sh" \
            "${PUBLISH_DIR}" \
            /github/workspace \
            /usr/share/dotnet

      - name: Send Build Info (with build log)
        if: always()
        env:
          CODELOGIC_HOST: ${{ vars.CODELOGIC_HOST }}
          AGENT_UUID: ${{ secrets.AGENT_UUID }}
          AGENT_PASSWORD: ${{ secrets.AGENT_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${GITHUB_WORKSPACE}/logs"
          # Missing/empty log should be rare now (restore+build+publish write one file).
          if [[ ! -s "${GITHUB_WORKSPACE}/logs/build.log" ]]; then
            {
              echo "WARNING: logs/build.log was missing or empty when send_build_info ran."
              echo "Job status: ${{ job.status }}"
              echo "Check earlier steps (checkout, SDK setup, or a cancelled job)."
            } > "${GITHUB_WORKSPACE}/logs/build.log"
          fi

          GH_STATUS="${{ job.status }}"
          case "${GH_STATUS}" in
            success)   BUILD_STATUS="SUCCESS" ;;
            failure)   BUILD_STATUS="FAILURE" ;;
            cancelled) BUILD_STATUS="CANCELLED" ;;
            *)         BUILD_STATUS="${GH_STATUS^^}" ;;
          esac

          docker run --pull always --rm \
            -e CODELOGIC_HOST \
            -e AGENT_UUID \
            -e AGENT_PASSWORD \
            -v "${GITHUB_WORKSPACE}:/scan" \
            thingsboard.app.codelogic.com/codelogic_dotnet:latest \
              send_build_info \
                --agent-uuid="${AGENT_UUID}" \
                --agent-password="${AGENT_PASSWORD}" \
                --server="${CODELOGIC_HOST}" \
                --path=/scan \
                --build-number="${{ github.run_number }}" \
                --pipeline-system="GitHub Actions" \
                --job-name="${{ github.repository }} — ${{ github.workflow }}" \
                --build-status="${BUILD_STATUS}" \
                --log-file=/scan/logs/build.log \
                --log-lines=50000 \
                --timeout=300 \
                --verbose

      - name: CodeLogic CI summary
        if: always()
        shell: bash
        run: |
          {
            echo "## CodeLogic CI"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Repository | \`${{ github.repository }}\` |"
            echo "| Workflow | \`${{ github.workflow }}\` |"
            echo "| Run | ${{ github.run_id }} (attempt ${{ github.run_attempt }}) |"
            echo "| Ref | \`${{ github.ref }}\` |"
            echo "| SHA | \`${{ github.sha }}\` |"
            echo "| Job status | **${{ job.status }}** |"
            echo ""
            echo "Build log is sent to CodeLogic via \`send_build_info\` when credentials are configured."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-build-log
          path: logs/build.log
          if-no-files-found: ignore
          retention-days: 14
