services:
  # Writes ./out on the host (bind-mounted from /repo/out) so CodeLogic and other tools can scan the same bits without hosting the SDK.
  # Run: docker compose --profile publish run --rm dotnet-publish
  dotnet-publish:
    profiles: ["publish"]
    image: mcr.microsoft.com/dotnet/sdk:8.0
    working_dir: /repo
    volumes:
      - .:/repo
    command:
      [
        "dotnet",
        "publish",
        "src/CompanyName.MyMeetings.sln",
        "-c",
        "Release",
        "-o",
        "/repo/out",
        "-p:NuGetAudit=false",
        "/p:TreatWarningsAsErrors=false",
        "-p:DeployOnBuild=false",
        "-p:DeployOnPublish=false",
      ]

  backend:
    container_name: mymeetings_backend
    build:
      context: ./src/
    ports:
      - "5000:8080"
    networks:
      - starfish-crm-network
    environment:
      - Meetings_ConnectionStrings__MeetingsConnectionString=Server=mymeetingsdb,1433;Database=MyMeetings;User=sa;Password=Test@12345;Encrypt=False;
    depends_on:
      migrator:
        condition: service_started
    restart: on-failure

  mymeetingsdb:
    build: ./src/Database/
    platform: linux/amd64
    ports:
      - 1445:1433
    networks:
      - starfish-crm-network

  migrator:
    container_name: mymeetings_db_migrator
    build:
      context: ./src/
      dockerfile: ./Database/Dockerfile_DatabaseMigrator
    networks:
      - starfish-crm-network
    depends_on:
      mymeetingsdb:
        condition: service_healthy
    environment:
      - ASPNETCORE_MyMeetings_IntegrationTests_ConnectionString=Server=mymeetingsdb,1433;Database=MyMeetings;User=sa;Password=Test@12345;Encrypt=False;
    command:
      [
        "./wait-for-it.sh",
        "mymeetingsdb:1433",
        "--timeout=60",
        "--",
        "/bin/bash",
        "/entrypoint_DatabaseMigrator.sh"
      ]
    restart: on-failure

networks:
  starfish-crm-network:
